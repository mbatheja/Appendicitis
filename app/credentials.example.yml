# Copy to app/credentials.yml (git-ignored) and fill in.
# Generate password hashes with app/tools/hash_passwords.ipynb.
credentials:
  usernames:
    admin:
      email: admin@example.com
      name: Admin
      password: <bcrypt hash>
      roles:
        - admin
    jdoe:
      email: jdoe@example.com
      name: Jane Doe
      password: <bcrypt hash>
      roles:
        - user

cookie:
  expiry_days: 30
  key: <long random string, e.g. python -c "import secrets; print(secrets.token_hex(32))">
  name: dss_auth
